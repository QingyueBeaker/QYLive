[package]
name = "lite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Capture / encode / RTMP engine for Lite RTMP Streamer"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
bytes = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
# NVENC 直连（运行时 dlopen nvEncodeAPI64.dll，不需要 CUDA SDK / Video Codec SDK 参与构建）
mini-nvcodec = "0.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_Xps",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics",
    "Win32_System_WinRT_Graphics_Capture",
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
] }
